<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thor and the Giant Battle!</title><style>
:root{--reading-size:40px;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f8f4e9;color:#233b3c;font-family:Arial,'Malgun Gothic',sans-serif}button,select,input{font:inherit}button,select{border:1px solid #c9cec2;border-radius:12px;background:#fffdf7;color:#233b3c;padding:10px 16px;cursor:pointer}button:hover{background:#e9eedf}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #cc7b27;outline-offset:3px}header{max-width:1600px;margin:auto;padding:24px 4vw 18px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{font-weight:800;font-size:18px}.brand span{color:#9c602b;margin-right:8px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tools label{font-size:14px;font-weight:700}input{width:110px;accent-color:#32645b}output{min-width:44px;font-size:14px}main{max-width:1600px;margin:auto;padding:20px 4vw 40px}.intro{margin:4px 0 25px}.eyebrow{letter-spacing:3px;font-size:12px;font-weight:bold;color:#8c663c}h1{font-family:Georgia,serif;font-size:clamp(30px,4vw,54px);margin:12px 0}.subtitle{color:#66746a;margin:0}.book{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:start}.art{position:sticky;top:24px;margin:0;background:#e5e9d7;padding:12px;border-radius:24px;box-shadow:0 12px 36px #233b3c12}.art img{display:block;width:100%;height:auto;border-radius:15px}.art figcaption{padding:12px 8px 4px;font-size:12px;letter-spacing:2px;color:#577064}.page{background:#fffdf8;border-radius:24px;padding:28px 34px;border:1px solid #e4e3d6;min-width:0}.scene{font-size:12px;letter-spacing:2px;color:#8c663c;font-weight:bold}.story{font-family:Arial,sans-serif;font-size:var(--reading-size);line-height:1.5;overflow-wrap:break-word}.story p{margin:0 0 .55em}.story p:first-child{margin-top:.5em}.story .sound{font-weight:800;color:#a35d23}.navigation{margin-top:28px;display:flex;align-items:center;gap:12px;justify-content:space-between}.navigation button:last-child{background:#2d6157;color:white;border-color:#2d6157}.progress{height:4px;background:#dfe4d6;border-radius:4px;margin-top:24px}.progress div{height:100%;background:#c38a42;border-radius:4px;transition:width .2s}footer{font-size:12px;color:#6f7b6e;margin-top:18px;text-align:center}select{max-width:130px}@media(max-width:850px){.book{grid-template-columns:1fr;gap:20px}.art{position:static}.page{padding:24px}.tools{gap:8px}header{padding-top:18px}main{padding-top:4px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
header{position:sticky;top:0;background:#f8f4e9f5;z-index:10;border-bottom:1px solid #e4e3d6;max-width:none}.book{display:block;max-width:960px;margin:auto}.episode{margin-bottom:60px}.art{position:static;padding:0;border-radius:20px 20px 0 0;overflow:hidden}.art img{border-radius:0}.page{border-radius:0 0 20px 20px;padding:32px 40px}.intro{text-align:center;margin-bottom:40px}.story p{margin-bottom:.35em}footer{padding-bottom:30px}@media(max-width:600px){.page{padding:24px 20px}.episode{margin-bottom:32px}input{width:75px}header{padding:12px 4vw}.brand{font-size:14px}}</style></head><body><header><div class="brand"><span>ϟ</span> LITTLE HERO LIBRARY</div><div class="tools"><label for="size">글자 크기</label><button id="smaller" aria-label="글자 작게">A−</button><input id="size" type="range" min="24" max="72" value="40" step="2"><output id="sizeValue" for="size">40px</output><button id="larger" aria-label="글자 크게">A+</button><button id="reset">40px 초기화</button></div></header><main><div class="intro"><div class="eyebrow">A LITTLE HERO WITH A BIG HEART</div><h1>Thor and the Giant Battle!</h1><p class="subtitle">그림과 함께 읽는 토르의 모험 · 아래로 스크롤해 주세요</p></div><div class="book"><figure class="art"><img id="art" src="scene-1.jpg" alt="Thor storybook cover"><figcaption id="artCaption">ILLUSTRATION 01 / 15</figcaption></figure><section class="page" aria-label="Story"><div class="scene" id="sceneLabel"></div><div class="story" id="story"></div><nav class="navigation" aria-label="장면 이동"><button id="prev">← 이전</button><select id="jump" aria-label="장면 선택"></select><button id="next">다음 →</button></nav><div class="progress" role="progressbar" aria-label="읽기 진행" aria-valuemin="1" aria-valuemax="15" id="progress"><div id="bar"></div></div></section></div><footer>아래로 스크롤하며 전체 이야기 읽기 · 글자 크기 24–72px</footer></main><script>
const scenes=["Thor and the Giant Battle!\nA Little Hero with a Big Heart", "BOOM! BOOM! BOOM!\nThor was the god of thunder.\nHe had a big magic hammer.\nHis name was Thor.\nHe was strong.\nHe was brave.\nAnd he loved to help!", "One day, Thor heard a loud cry.\n\"HELP! HELP!\"\nA little goat ran to him.\n\"Thor! Big giants are coming!\"", "Thor looked up.\nThree HUGE giants stood on a hill.\nSTOMP! STOMP! STOMP!\nThe ground shook.\nThe trees fell.\nThe goats ran away.\n\"HA! HA! HA!\" laughed the giants.\n\"This land is ours!\"", "Thor stood tall.\n\"No!\" he said.\n\"You cannot hurt my friends!\"", "The biggest giant came close.\nHe was as tall as a tree!\n\"YOU ARE TOO SMALL!\" he yelled.\nThor held up his hammer.\n\"Watch me!\" said Thor.", "WHOOSH!\nThor flew into the sky.\nThe wind blew hard.\nThe clouds grew dark.", "FLASH!\nA big light filled the sky.\nBOOOOOM!\nThor hit the ground with his hammer.", "The giants jumped back.\n\"WHAT WAS THAT?\" they cried.\n\"It is my thunder!\" said Thor.\nThe first giant ran away.\nThe second giant ran away.\nBut the biggest giant stayed.\n\"I AM NOT SCARED!\" he yelled.", "He picked up a HUGE rock.\nHe threw it at Thor!\nWHOOSH!\nThor jumped high.\nThe rock flew past him.\nCRASH!\nIt hit the ground.", "Thor spun his hammer.\nRound and round!\nFaster and faster!\n\"GO, HAMMER, GO!\"\nWHOOSH!\nThe hammer flew!", "BOOM!\nIt hit the giant's big shield.\nThe shield broke!\nThe giant fell on his bottom.\n\"OOPS!\" he cried.", "Thor stood tall.\n\"Go home!\" he said.\n\"And do not hurt my friends!\"\nThe giant got up.\nHe ran away.\nSTOMP! STOMP! STOMP!\nSoon, all the giants were gone.", "The little goat ran to Thor.\n\"YOU DID IT!\" he cried.\n\"You are so strong!\"\nThor smiled.\n\"Yes, I am strong,\" he said.\n\"But I am brave because I help.\"\nThe little goat gave Thor a hug.\nThor laughed.", "And up in the sky...\nRUMBLE! RUMBLE!\nThe thunder said...\n\"HOORAY FOR THOR!\"\nTHE END."];
const alts=['Cover of Thor and the Giant Battle','Thor with his magic hammer','A little goat asks Thor for help','Three giants threaten the land','Thor protects his friends','Thor faces the biggest giant','Thor flies into storm clouds','Thor strikes the ground with thunder','The giants recoil from the thunder','Thor dodges a huge rock','Thor spins his magic hammer','The giant falls after his shield breaks','The giant runs away','The little goat hugs Thor','Thor celebrates with his friends'];
const el=id=>document.getElementById(id);const book=document.querySelector('.book');book.replaceChildren();scenes.forEach((text,i)=>{const section=document.createElement('section');section.className='episode';const figure=document.createElement('figure');figure.className='art';const img=document.createElement('img');img.src=`scene-${i+1}.jpg`;img.alt=alts[i];img.loading=i===0?'eager':'lazy';img.width=1376;img.height=768;figure.append(img);const page=document.createElement('div');page.className='page';const label=document.createElement('div');label.className='scene';label.textContent=`SCENE ${String(i+1).padStart(2,'0')} / 15`;const story=document.createElement('div');story.className='story';text.split('\n').forEach(line=>{const p=document.createElement('p');p.textContent=line;if(/^(BOOM|WHOOSH|FLASH|STOMP|CRASH|RUMBLE|THE END|"HOORAY)/.test(line))p.className='sound';story.append(p)});page.append(label,story);section.append(figure,page);book.append(section)});
function size(n){n=Math.max(24,Math.min(72,Number(n)));document.documentElement.style.setProperty('--reading-size',n+'px');el('size').value=n;el('sizeValue').textContent=n+'px';el('smaller').disabled=n===24;el('larger').disabled=n===72;try{localStorage.setItem('thor-font-size',n)}catch{}}el('size').oninput=e=>size(e.target.value);el('smaller').onclick=()=>size(+el('size').value-2);el('larger').onclick=()=>size(+el('size').value+2);el('reset').onclick=()=>size(40);let saved=40;try{saved=Number(localStorage.getItem('thor-font-size'))||40}catch{}size(saved);
</script></body></html>
